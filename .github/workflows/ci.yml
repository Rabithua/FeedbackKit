name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: feedbackkit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test package
        run: swift test
      - name: Build for iOS
        run: >-
          xcodebuild
          -scheme FeedbackKit-Package
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build Fixture Demo
        run: >-
          xcodebuild
          -project Examples/FeedbackKitDemo/FeedbackKitDemo.xcodeproj
          -scheme FeedbackKitDemo
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
